openapi: 3.0.3
info:
  title: Cairn Ingest RSS Service API
  description: |
    The Ingest RSS Service is responsible for managing RSS feed subscriptions,
    polling feeds for new content, and delivering content to the Content Service.
    It implements a tiered polling strategy based on feed activity and uses an outbox pattern
    for reliable content delivery.
  version: 1.0.0
  contact:
    name: Cairn Backend
servers:
  - url: http://localhost:8081
    description: Development server
  - url: http://localhost:8081/api/v1
    description: Development server with API prefix

tags:
  - name: Feed Subscriptions
    description: Feed subscription management operations

paths:
  /api/v1/users/{user_id}/feeds/subscribe:
    post:
      tags:
        - Feed Subscriptions
      summary: Subscribe to a feed
      description: |
        Subscribe a user to an RSS/Atom feed. This endpoint validates the feed URL,
        checks the 100 feed limit per user, and creates the feed if it doesn't exist
        or links to an existing feed.
      operationId: subscribeToFeed
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToFeedRequest'
            example:
              feed_url: "https://blog.example.com/feed.xml"
      responses:
        '201':
          description: Successfully subscribed to feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedSubscriptionResponse'
        '400':
          description: Bad request - invalid feed URL or feed limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidURL:
                  summary: Invalid feed URL
                  value:
                    error: "Invalid feed URL format"
                    code: "INVALID_FEED_URL"
                feedLimitExceeded:
                  summary: Feed limit exceeded
                  value:
                    error: "User has reached the maximum of 100 feeds"
                    code: "FEED_LIMIT_EXCEEDED"
        '409':
          description: Already subscribed to this feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}/feeds:
    get:
      tags:
        - Feed Subscriptions
      summary: List user's feed subscriptions
      description: Retrieve a list of all feeds a user is subscribed to
      operationId: listUserFeeds
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Number of feeds to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Offset for pagination
      responses:
        '200':
          description: Feed subscriptions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFeedSubscriptionsResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}/feeds/{feed_id}:
    delete:
      tags:
        - Feed Subscriptions
      summary: Unsubscribe from feed
      description: Remove a user's subscription to a feed
      operationId: unsubscribeFromFeed
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - name: feed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feed ID
      responses:
        '204':
          description: Successfully unsubscribed from feed
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/feeds/{feed_id}/enable:
    patch:
      tags:
        - Feed Subscriptions
      summary: Re-enable a disabled feed
      description: |
        Re-enable a feed that was automatically disabled due to consecutive errors.
        Resets error counters and sets the feed status to 'active'.
      operationId: enableFeed
      parameters:
        - name: feed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feed ID
      responses:
        '200':
          description: Feed successfully enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponse'
        '404':
          description: Feed not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Check if the service is running
      operationId: getLiveness
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Check if the service is ready to accept traffic (includes database connection check)
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  database:
                    type: string
                    example: "connected"
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "unavailable"
                  database:
                    type: string
                    example: "disconnected"

components:
  schemas:
    SubscribeToFeedRequest:
      type: object
      required:
        - feed_url
      properties:
        feed_url:
          type: string
          format: uri
          description: URL of the RSS/Atom feed
          example: "https://blog.example.com/feed.xml"

    FeedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Feed ID
        feed_url:
          type: string
          format: uri
          description: Feed URL
        title:
          type: string
          description: Feed title
        description:
          type: string
          description: Feed description
        site_url:
          type: string
          format: uri
          description: Website URL
        polling_tier:
          type: string
          enum: [active, moderate, quiet]
          description: Current polling tier based on activity
        status:
          type: string
          enum: [active, disabled, error]
          description: Feed status
        last_fetched_at:
          type: string
          format: date-time
          description: Last successful fetch timestamp
        last_published_at:
          type: string
          format: date-time
          description: Last time new content was published
        next_poll_at:
          type: string
          format: date-time
          description: Next scheduled poll time
        consecutive_error_days:
          type: integer
          description: Number of consecutive days with errors
        last_error_at:
          type: string
          format: date-time
          description: Last error timestamp
        last_error_message:
          type: string
          description: Last error message
        created_at:
          type: string
          format: date-time
          description: Feed creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Feed last update timestamp

    FeedSubscriptionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Subscription ID
        user_id:
          type: string
          format: uuid
          description: User ID
        feed_id:
          type: string
          format: uuid
          description: Feed ID
        subscribed_at:
          type: string
          format: date-time
          description: Subscription timestamp
        feed:
          $ref: '#/components/schemas/FeedResponse'

    ListFeedSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/FeedSubscriptionResponse'
        total:
          type: integer
          description: Total number of subscriptions
        limit:
          type: integer
          description: Limit used for this request
        offset:
          type: integer
          description: Offset used for this request

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
