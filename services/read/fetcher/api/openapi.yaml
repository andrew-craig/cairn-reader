openapi: 3.0.3
info:
  title: Cairn Ingest RSS Service API
  description: |
    The Ingest RSS Service is responsible for managing RSS feed subscriptions,
    polling feeds for new content, and delivering content to the Content Service.
    It implements a tiered polling strategy based on feed activity and uses an outbox pattern
    for reliable content delivery.

    This service is internal-facing only, reached through the Content Service gateway.
    Every route under `/api/v1/source/rss` requires the `X-Internal-API-Key` header —
    it has no JWT context of its own, so `user_id` in the path is never trusted without it.
  version: 1.0.0
  contact:
    name: Cairn Backend
servers:
  - url: http://localhost:8081
    description: Development server

tags:
  - name: Feed Subscriptions
    description: Feed subscription management operations
  - name: Health
    description: Liveness and readiness probes

security:
  - InternalApiKey: []

paths:
  /api/v1/source/rss/user/{user_id}/subscription:
    post:
      tags:
        - Feed Subscriptions
      summary: Subscribe to a feed
      description: |
        Subscribe a user to an RSS/Atom feed. This endpoint validates the feed URL,
        checks the 100 feed limit per user, and creates the feed if it doesn't exist
        or links to an existing feed. Responses are wrapped as `{data, meta}`.
      operationId: subscribeToFeed
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeToFeedRequest'
            example:
              feed_url: "https://blog.example.com/feed.xml"
      responses:
        '201':
          description: Successfully subscribed to feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SubscribeFeedResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Bad request - invalid user ID, invalid body, invalid or non-RSS/Atom feed URL (`validation_error`), or feed limit exceeded (`bad_request`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidURL:
                  summary: Not a valid feed
                  value:
                    error: "validation_error"
                    message: "Feed URL is not a valid RSS/Atom feed"
                    meta:
                      timestamp: "2026-01-01T00:00:00Z"
                      version: "v1"
                feedLimitExceeded:
                  summary: Feed limit exceeded
                  value:
                    error: "bad_request"
                    message: "user has reached maximum feed limit of 100"
                    meta:
                      timestamp: "2026-01-01T00:00:00Z"
                      version: "v1"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HttpsRequired'
        '409':
          description: Already subscribed to this feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Feed Subscriptions
      summary: List user's feed subscriptions
      description: Retrieve all feeds a user is subscribed to. Not paginated. Responses are wrapped as `{data, meta}`.
      operationId: listUserFeeds
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Feed subscriptions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ListFeedSubscriptionsResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Bad request - invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/source/rss/user/{user_id}/subscription/{feed_id}:
    delete:
      tags:
        - Feed Subscriptions
      summary: Unsubscribe from feed
      description: Remove a user's subscription to a feed. Responses are wrapped as `{data, meta}`.
      operationId: unsubscribeFromFeed
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: feed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feed ID
      responses:
        '200':
          description: Successfully unsubscribed from feed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Bad request - invalid user ID or feed ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HttpsRequired'
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/source/rss/feed/{feed_id}:
    patch:
      tags:
        - Feed Subscriptions
      summary: Update feed (re-enable)
      description: |
        Re-enables a feed that was automatically disabled due to consecutive errors.
        `enabled: false` is accepted but currently a no-op (returns 200 "Feed update received").
        A body without `enabled` returns 400. Responses are wrapped as `{data, meta}`.
      operationId: updateFeed
      parameters:
        - name: feed_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Feed ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                  description: "`true` re-enables the feed for polling; `false` is currently a no-op"
      responses:
        '200':
          description: Feed successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          description: Bad request - invalid feed ID, invalid body, no `enabled` field, or feed already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HttpsRequired'
        '404':
          description: Feed not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /:
    get:
      tags:
        - Health
      summary: Service info
      description: Root endpoint returning static service info
      operationId: getRoot
      security: []
      responses:
        '200':
          description: Service info
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: "rss-fetcher-service"
                  version:
                    type: string
                    example: "0.1.0"
                  status:
                    type: string
                    example: "running"

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Check if the service is running
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Check if the service is ready to accept traffic (includes database connection check)
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: "ok"
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "unhealthy"
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: "error"

components:
  securitySchemes:
    InternalApiKey:
      type: apiKey
      in: header
      name: X-Internal-API-Key
      description: Shared secret for internal service-to-service calls (Content Service is the only caller)
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User ID
  responses:
    Unauthorized:
      description: Missing or invalid `X-Internal-API-Key`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HttpsRequired:
      description: Request was not over HTTPS (no TLS and no X-Forwarded-Proto https header)
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "HTTPS required"
  schemas:
    SubscribeToFeedRequest:
      type: object
      required:
        - feed_url
      properties:
        feed_url:
          type: string
          format: uri
          description: URL of the RSS/Atom feed
          example: "https://blog.example.com/feed.xml"

    SubscribeFeedResponse:
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
        feed_url:
          type: string
          format: uri
        feed_title:
          type: string
          description: Feed title, or "Untitled Feed" when none was extracted
        is_new_feed:
          type: boolean
          description: True if this subscription created the feed, false if it linked to an existing feed
        subscribed_at:
          type: string
          format: date-time

    FeedSubscriptionResponse:
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
        feed_url:
          type: string
          format: uri
        feed_title:
          type: string
          description: Feed title, or "Untitled Feed" when none was extracted
        feed_status:
          type: string
          enum: [active, disabled]
        polling_tier:
          type: string
          enum: [active, moderate, quiet]
          description: Polling tier based on activity (hourly, 6-hourly, daily)
        last_fetched_at:
          type: string
          format: date-time
          description: Last successful fetch timestamp (omitted if never fetched)
        subscribed_at:
          type: string
          format: date-time

    ListFeedSubscriptionsResponse:
      type: object
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/FeedSubscriptionResponse'
        count:
          type: integer
          description: Number of subscriptions returned

    MessageResponse:
      type: object
      properties:
        message:
          type: string
        success:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: bad_request
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Optional additional error details
        meta:
          $ref: '#/components/schemas/Meta'

    Meta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: v1
