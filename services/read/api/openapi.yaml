openapi: 3.0.3
info:
  title: Cairn Read Service API
  version: 0.4.0
  description: |
    Content storage and RSS feed subscription service for Cairn.

    The Read service consists of two microservices:
    - **Fetcher Service** (port 8082): RSS feed subscription management
    - **Content Service** (port 8083): Article content storage and user-specific metadata

    ## Architecture
    Each service has its own PostgreSQL database. The fetcher manages RSS feed subscriptions,
    while the content service stores article content and user reading metadata.

    ## Features
    - RSS feed subscription management with polling tiers
    - Content extraction and storage with duplicate detection
    - User-specific content metadata (read status, favorites, scroll position)
    - Bulk operations for efficient batch processing
    - Full-text search capabilities

    ## Content Flow
    1. Users subscribe to RSS feeds via the Fetcher Service
    2. Background workers fetch feed content
    3. Content is stored and processed via the Content Service
    4. Users can manage their reading list and metadata
  contact:
    name: Cairn API Support
    url: https://github.com/cairn-app/cairn-reader
  license:
    name: MIT

servers:
  - url: http://localhost:8082
    description: Fetcher service (local development)
  - url: http://localhost:8083
    description: Content service (local development)

tags:
  - name: Health
    description: Health check endpoints
  - name: Feed Subscriptions
    description: RSS feed subscription management (Fetcher Service)
  - name: Content
    description: Article content operations (Content Service)
  - name: User Content
    description: User-specific content metadata (Content Service)
  - name: Bulk Operations
    description: Batch processing endpoints (Content Service)

paths:
  # Fetcher Service Endpoints (Port 8082)
  /health:
    get:
      tags:
        - Health
      summary: Health check (Fetcher Service)
      description: Returns the health status of the fetcher service with database connectivity check
      operationId: fetcherHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: rss-fetcher-service
        '503':
          description: Service unavailable (database connection failed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  service:
                    type: string
                    example: rss-fetcher-service
                  message:
                    type: string
                    example: Database connection failed
                  error:
                    type: string

  /:
    get:
      tags:
        - Health
      summary: Service info
      description: Returns service name, version, and status
      operationId: fetcherInfo
      responses:
        '200':
          description: Service information
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: rss-fetcher-service
                  version:
                    type: string
                    example: 0.1.0
                  status:
                    type: string
                    example: running

  /api/v1/users/{user_id}/feeds/subscribe:
    post:
      tags:
        - Feed Subscriptions
      summary: Subscribe to RSS feed
      description: |
        Subscribe a user to an RSS feed. If the feed already exists, creates a subscription.
        If it's a new feed, it will be added to the database and scheduled for fetching.
      operationId: subscribeFeed
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feed_url:
                  type: string
                  format: uri
                  description: URL of the RSS/Atom feed
                  example: https://example.com/feed.xml
              required:
                - feed_url
      responses:
        '200':
          description: Successfully subscribed to feed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscribeFeedResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{user_id}/feeds:
    get:
      tags:
        - Feed Subscriptions
      summary: List user's feed subscriptions
      description: Returns all RSS feeds the user is subscribed to
      operationId: listFeedSubscriptions
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of feed subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFeedSubscriptionsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{user_id}/feeds/{feed_id}:
    delete:
      tags:
        - Feed Subscriptions
      summary: Unsubscribe from feed
      description: Removes user's subscription to a specific feed
      operationId: unsubscribeFeed
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
        - name: feed_id
          in: path
          required: true
          description: Feed ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully unsubscribed
                  success:
                    type: boolean
                    example: true
        '404':
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/feeds/{feed_id}/enable:
    patch:
      tags:
        - Feed Subscriptions
      summary: Enable feed fetching
      description: Re-enables a disabled feed for fetching
      operationId: enableFeed
      parameters:
        - name: feed_id
          in: path
          required: true
          description: Feed ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Feed enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Feed enabled successfully
                  success:
                    type: boolean
                    example: true
        '404':
          description: Feed not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Content Service Endpoints (Port 8083)
  /api/v1/contents:
    post:
      tags:
        - Content
      summary: Create content
      description: |
        Creates a new content item by extracting readable content from HTML.
        Performs duplicate detection based on content hash.
      operationId: createContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentRequest'
      responses:
        '201':
          description: Content created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Content already exists (duplicate)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/contents/{id}:
    get:
      tags:
        - Content
      summary: Get content by ID
      description: Retrieves a content item by its ID
      operationId: getContent
      parameters:
        - name: id
          in: path
          required: true
          description: Content ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Content retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Content
      summary: Update content
      description: Updates an existing content item
      operationId: updateContent
      parameters:
        - name: id
          in: path
          required: true
          description: Content ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentRequest'
      responses:
        '200':
          description: Content updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/contents/bulk:
    post:
      tags:
        - Bulk Operations
      summary: Bulk create content
      description: |
        Creates multiple content items in a single request.
        Returns created items, existing duplicates, and any failures.
      operationId: bulkCreateContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateContentRequest'
      responses:
        '200':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/contents/check-duplicates:
    post:
      tags:
        - Bulk Operations
      summary: Check for duplicate content
      description: |
        Checks if content items already exist based on content hash and source feed.
        Useful before bulk creating content to avoid duplicates.
      operationId: checkDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDuplicatesRequest'
      responses:
        '200':
          description: Duplicate check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckDuplicatesResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{user_id}/contents:
    get:
      tags:
        - User Content
      summary: List user's content
      description: |
        Returns content items saved by the user with pagination.
        Supports filtering by status (unread, reading, completed, archived).
      operationId: listUserContents
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Filter by status
          schema:
            type: string
            enum: [unread, reading, completed, archived]
        - name: is_favorite
          in: query
          required: false
          description: Filter by favorite status
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          description: Maximum number of items to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Number of items to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: User contents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContentsListResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags:
        - User Content
      summary: Add content to user's list
      description: Adds an existing content item to user's reading list
      operationId: addContentToUser
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContentToUserRequest'
      responses:
        '201':
          description: Content added to user successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Content already added to user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{user_id}/contents/search:
    get:
      tags:
        - User Content
      summary: Search user's content
      description: Full-text search across user's saved content (title, author, description)
      operationId: searchUserContents
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: true
          description: Search query
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          description: Maximum number of results
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContentsListResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{user_id}/contents/{content_id}:
    patch:
      tags:
        - User Content
      summary: Update user content metadata
      description: |
        Updates user-specific metadata for a content item
        (status, scroll position, favorite status)
      operationId: updateUserContent
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
        - name: content_id
          in: path
          required: true
          description: Content ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserContentRequest'
      responses:
        '200':
          description: User content updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContentResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - User Content
      summary: Remove content from user's list
      description: Removes a content item from user's reading list
      operationId: deleteUserContent
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
        - name: content_id
          in: path
          required: true
          description: Content ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User content deleted successfully
        '404':
          description: User content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/bulk/contents:
    post:
      tags:
        - Bulk Operations
      summary: Bulk add content to users
      description: |
        Adds multiple content items to multiple users in a single request.
        Useful for distributing new feed items to subscribers.
      operationId: bulkAddToUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkAddToUsersRequest'
      responses:
        '200':
          description: Bulk operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkAddToUsersResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # Fetcher Service Schemas
    SubscribeFeedResponse:
      type: object
      description: Response after subscribing to a feed
      properties:
        subscription_id:
          type: string
          format: uuid
          description: Unique subscription ID
        feed_id:
          type: string
          format: uuid
          description: Feed ID
        feed_url:
          type: string
          format: uri
          description: URL of the feed
        feed_title:
          type: string
          description: Title of the feed
        is_new_feed:
          type: boolean
          description: Whether this is a newly added feed
        subscribed_at:
          type: string
          format: date-time
          description: Subscription timestamp
      required:
        - subscription_id
        - feed_id
        - feed_url
        - feed_title
        - is_new_feed
        - subscribed_at

    FeedSubscriptionResponse:
      type: object
      description: A single feed subscription
      properties:
        subscription_id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
        feed_url:
          type: string
          format: uri
        feed_title:
          type: string
        feed_status:
          type: string
          enum: [active, disabled, failed]
          description: Current status of the feed
        polling_tier:
          type: string
          enum: [high, medium, low]
          description: Polling frequency tier
        last_fetched_at:
          type: string
          format: date-time
          nullable: true
          description: Last successful fetch time
        subscribed_at:
          type: string
          format: date-time
      required:
        - subscription_id
        - feed_id
        - feed_url
        - feed_title
        - feed_status
        - polling_tier
        - subscribed_at

    ListFeedSubscriptionsResponse:
      type: object
      description: List of feed subscriptions
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/FeedSubscriptionResponse'
        count:
          type: integer
          description: Total number of subscriptions
      required:
        - subscriptions
        - count

    # Content Service Schemas
    CreateContentRequest:
      type: object
      description: Request to create content
      properties:
        url:
          type: string
          format: uri
          description: URL of the article
        html:
          type: string
          nullable: true
          description: HTML content to extract (optional if URL is fetchable)
        source_type:
          type: string
          enum: [rss, manual, web]
          description: Type of content source
        source_feed_id:
          type: string
          format: uuid
          nullable: true
          description: ID of source feed (if from RSS)
        published_at:
          type: string
          format: date-time
          nullable: true
          description: Original publication date
      required:
        - url
        - source_type

    UpdateContentRequest:
      type: object
      description: Request to update content
      properties:
        url:
          type: string
          format: uri
        html:
          type: string
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
        - url
        - html

    ContentResponse:
      type: object
      description: Content item response
      properties:
        id:
          type: string
          format: uuid
        content_hash:
          type: string
          description: SHA256 hash of cleaned HTML
        cleaned_html:
          type: string
          description: Extracted readable content
        original_url:
          type: string
          format: uri
        canonical_url:
          type: string
          format: uri
          nullable: true
        title:
          type: string
        author:
          type: string
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
        image_urls:
          type: array
          items:
            type: string
            format: uri
        source_type:
          type: string
          enum: [rss, manual, web]
        source_feed_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - content_hash
        - cleaned_html
        - original_url
        - title
        - source_type
        - created_at
        - updated_at

    AddContentToUserRequest:
      type: object
      description: Request to add content to user's list
      properties:
        content_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [unread, reading, completed, archived]
          default: unread
        scroll_position:
          type: integer
          minimum: 0
          default: 0
        is_favorite:
          type: boolean
          default: false
      required:
        - content_id

    UpdateUserContentRequest:
      type: object
      description: Request to update user content metadata
      properties:
        status:
          type: string
          enum: [unread, reading, completed, archived]
          nullable: true
        scroll_position:
          type: integer
          minimum: 0
          nullable: true
        is_favorite:
          type: boolean
          nullable: true

    UserContentResponse:
      type: object
      description: User-content item with metadata
      properties:
        id:
          type: string
          format: uuid
          description: User-content ID
        user_id:
          type: string
          format: uuid
        content_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [unread, reading, completed, archived]
        scroll_position:
          type: integer
        is_favorite:
          type: boolean
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        content:
          $ref: '#/components/schemas/ContentResponse'
          nullable: true
          description: Content details (included when expanded)
      required:
        - id
        - user_id
        - content_id
        - status
        - scroll_position
        - is_favorite
        - added_at
        - updated_at

    UserContentsListResponse:
      type: object
      description: Paginated list of user contents
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/UserContentResponse'
        total_count:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer
        next_cursor:
          type: string
          nullable: true
          description: Cursor for next page (if available)
      required:
        - contents
        - total_count
        - limit
        - offset

    # Bulk Operation Schemas
    BulkContentItem:
      type: object
      description: Single item in bulk content creation
      properties:
        url:
          type: string
          format: uri
        html:
          type: string
        source_type:
          type: string
          enum: [rss, manual, web]
        source_feed_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
        - url
        - html
        - source_type

    BulkCreateContentRequest:
      type: object
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/BulkContentItem'
          minItems: 1
          maxItems: 100
      required:
        - contents

    BulkFailedItem:
      type: object
      description: Failed item in bulk operation
      properties:
        index:
          type: integer
          description: Index in the original request array
        url:
          type: string
        error:
          type: string
        message:
          type: string
      required:
        - index
        - url
        - error
        - message

    BulkCreateContentResponse:
      type: object
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/ContentResponse'
          description: Successfully created content items
        existing:
          type: array
          items:
            $ref: '#/components/schemas/ContentResponse'
          description: Content items that already existed
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BulkFailedItem'
          description: Failed items with error details
      required:
        - created
        - existing
        - failed

    CheckDuplicatesItem:
      type: object
      properties:
        content_hash:
          type: string
          description: SHA256 hash of content
        source_feed_id:
          type: string
          format: uuid
      required:
        - content_hash
        - source_feed_id

    CheckDuplicatesRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckDuplicatesItem'
          minItems: 1
          maxItems: 100
      required:
        - items

    DuplicateCheckResult:
      type: object
      properties:
        content_hash:
          type: string
        exists:
          type: boolean
        content_id:
          type: string
          format: uuid
          nullable: true
        content:
          $ref: '#/components/schemas/ContentResponse'
          nullable: true
      required:
        - content_hash
        - exists

    CheckDuplicatesResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCheckResult'
      required:
        - results

    BulkAddToUsersItem:
      type: object
      properties:
        content_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [unread, reading, completed, archived]
          default: unread
      required:
        - content_id
        - user_id

    BulkAddToUsersRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkAddToUsersItem'
          minItems: 1
          maxItems: 1000
      required:
        - items

    BulkAddToUsersResponse:
      type: object
      properties:
        succeeded:
          type: array
          items:
            type: string
            format: uuid
          description: IDs of successfully created user_content records
        failed:
          type: array
          items:
            $ref: '#/components/schemas/BulkFailedItem'
      required:
        - succeeded
        - failed

    Error:
      type: object
      description: Standard error response
      properties:
        error:
          type: string
          description: Error type/code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties:
            type: string
          description: Additional error details
        code:
          type: integer
          description: HTTP status code
      required:
        - error
        - message
