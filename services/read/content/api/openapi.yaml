openapi: 3.0.3
info:
  title: Cairn Content Service API
  description: |
    The Content Service is responsible for storing and serving article content with user-specific metadata.
    It provides endpoints for content creation, retrieval, user-content relationship management, and search functionality.
  version: 1.0.0
  contact:
    name: Cairn Backend
servers:
  - url: http://localhost:8080
    description: Development server
  - url: http://localhost:8080/api/v1
    description: Development server with API prefix

tags:
  - name: Contents
    description: Content management operations
  - name: User Contents
    description: User-specific content operations
  - name: Bulk Operations
    description: Bulk content operations for RSS Fetcher Service
  - name: URL Detection
    description: URL type detection and smart submission

paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Simple health check to verify the process is running
      operationId: healthLive
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"

  /health/ready:
    get:
      summary: Readiness probe
      description: Health check that verifies database connectivity and service readiness
      operationId: healthReady
      responses:
        '200':
          description: Service is ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: "ok"
        '503':
          description: Service is not ready (database unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "unhealthy"
                  checks:
                    type: object
                    properties:
                      database:
                        type: string
                        example: "error"

  /api/v1/content/detect:
    post:
      tags:
        - URL Detection
      summary: Detect URL type
      description: |
        Determines if a URL is an RSS/Atom feed or a web page. This is a non-blocking operation
        with a 10-second timeout. Used by mobile apps to provide smart URL submission (e.g.,
        showing "Add Feed" vs "Add" button).
      operationId: detectURL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectURLRequest'
            example:
              url: "https://example.com/feed.xml"
      responses:
        '200':
          description: URL detection completed (may return "unknown" on timeout/error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectURLResponse'
              examples:
                feedDetected:
                  summary: RSS/Atom feed detected
                  value:
                    url: "https://example.com/feed.xml"
                    type: "feed"
                    title: "Example Blog"
                pageDetected:
                  summary: Web page detected
                  value:
                    url: "https://example.com/article"
                    type: "page"
                    title: "Example Article Title"
                unknownType:
                  summary: Detection failed or timed out
                  value:
                    url: "https://example.com"
                    type: "unknown"
                    title: null
        '400':
          description: Bad request - invalid URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content:
    post:
      tags:
        - Contents
      summary: Create content
      description: Create a new content item from HTML or URL
      operationId: createContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentRequest'
            examples:
              fromHTML:
                summary: Create from HTML
                value:
                  html: "<html><body><h1>Article Title</h1><p>Content here...</p></body></html>"
                  source_url: "https://example.com/article"
                  title: "Article Title"
                  author: "John Doe"
                  published_at: "2025-01-15T10:00:00Z"
                  source_feed_id: "123e4567-e89b-12d3-a456-426614174000"
              fromURL:
                summary: Create from URL
                value:
                  source_url: "https://example.com/article"
                  source_feed_id: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '201':
          description: Content created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Content too large (exceeds 5MB limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content/{content_id}:
    get:
      tags:
        - Contents
      summary: Get content by ID
      description: Retrieve a specific content item by its ID
      operationId: getContent
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Content ID
      responses:
        '200':
          description: Content retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Contents
      summary: Update content
      description: Update an existing content item (preserves user-content relationships)
      operationId: updateContent
      parameters:
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Content ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentRequest'
      responses:
        '200':
          description: Content updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content/bulk:
    post:
      tags:
        - Bulk Operations
      summary: Batch create/update contents
      description: Create or update multiple content items in a single request (max 100 items)
      operationId: bulkCreateContents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateContentRequest'
      responses:
        '200':
          description: Bulk operation completed (may include partial failures)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkCreateContentResponse'
        '400':
          description: Bad request - invalid input or too many items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content/check-duplicate:
    post:
      tags:
        - Bulk Operations
      summary: Check for existing content
      description: Check if content already exists by feed_id + content_hash
      operationId: checkDuplicates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckDuplicatesRequest'
      responses:
        '200':
          description: Duplicate check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckDuplicatesResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content/user/{user_id}:
    get:
      tags:
        - User Contents
      summary: List user's contents
      description: Retrieve a paginated list of contents for a specific user with optional filtering
      operationId: listUserContents
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - name: status
          in: query
          schema:
            type: string
            enum: [unread, reading, completed, archived]
          description: Filter by reading status
        - name: is_favorite
          in: query
          schema:
            type: boolean
          description: Filter by favorite status
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of items per page
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor for pagination (base64 encoded timestamp)
      responses:
        '200':
          description: User contents retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserContentsResponse'
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - User Contents
      summary: Add content to user's list
      description: |
        Add content to a user's reading list. Supports two modes:

        **URL-based submission (recommended)**: Provide a URL with optional type hint. The service will:
        - Detect if the URL is a feed or page (if type not provided)
        - Subscribe to feed (if type=feed) via Ingest RSS service
        - Extract and add page content (if type=page or unknown)

        **Content-ID-based submission (legacy)**: Provide a pre-created content_id to add existing content.
      operationId: addContentToUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddContentToUserRequest'
            examples:
              urlBasedFeed:
                summary: Add RSS feed (URL-based)
                value:
                  url: "https://example.com/feed.xml"
                  type: "feed"
                  title: "Example Blog"
              urlBasedPage:
                summary: Add web page (URL-based)
                value:
                  url: "https://example.com/article"
                  type: "page"
              urlBasedAuto:
                summary: Auto-detect type
                value:
                  url: "https://example.com/some-url"
              contentIdBased:
                summary: Add pre-created content (legacy)
                value:
                  content_id: "123e4567-e89b-12d3-a456-426614174000"
      responses:
        '201':
          description: Content added to user's list or feed subscribed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AddFeedResponse'
                  - $ref: '#/components/schemas/AddPageResponse'
                  - $ref: '#/components/schemas/UserContentResponse'
              examples:
                feedSubscribed:
                  summary: Feed subscription created
                  value:
                    type: "feed"
                    feed_id: "123e4567-e89b-12d3-a456-426614174000"
                    subscription:
                      id: "123e4567-e89b-12d3-a456-426614174001"
                      user_id: "123e4567-e89b-12d3-a456-426614174002"
                      feed_id: "123e4567-e89b-12d3-a456-426614174000"
                      feed_url: "https://example.com/feed.xml"
                      title: "Example Blog"
                      subscribed_at: "2025-01-04T10:00:00Z"
                pageAdded:
                  summary: Page content added
                  value:
                    type: "page"
                    content:
                      user_id: "123e4567-e89b-12d3-a456-426614174002"
                      content_id: "123e4567-e89b-12d3-a456-426614174003"
                      status: "unread"
                      scroll_position: 0
                      is_favorite: false
                      added_at: "2025-01-04T10:00:00Z"
                      content:
                        id: "123e4567-e89b-12d3-a456-426614174003"
                        title: "Example Article"
                        source_url: "https://example.com/article"
        '400':
          description: Bad request - invalid input or feed limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Content not found (content_id mode only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict - already subscribed to feed or content already in list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content/user/{user_id}/{content_id}:
    patch:
      tags:
        - User Contents
      summary: Update user-content metadata
      description: Update user-specific metadata (status, scroll position, favorite flag)
      operationId: updateUserContent
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Content ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserContentRequest'
      responses:
        '200':
          description: User-content metadata updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContentResponse'
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User-content relationship not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - User Contents
      summary: Remove content from user's list
      description: Remove a content item from a user's reading list (hard delete of user-content relationship)
      operationId: deleteUserContent
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - name: content_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Content ID
      responses:
        '204':
          description: Content removed from user's list
        '404':
          description: User-content relationship not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/content/user/{user_id}/search:
    get:
      tags:
        - User Contents
      summary: Search user's contents
      description: Search user's contents using PostgreSQL full-text search (title and author)
      operationId: searchUserContents
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User ID
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query (searches in title and author fields)
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of results to return
      responses:
        '200':
          description: Search results retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUserContentsResponse'
        '400':
          description: Bad request - missing or invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateContentRequest:
      type: object
      required:
        - source_url
      properties:
        html:
          type: string
          description: Raw HTML content (optional, will fetch from source_url if not provided)
          maxLength: 5242880  # 5MB
        source_url:
          type: string
          format: uri
          description: URL of the original article
        title:
          type: string
          description: Article title (optional, extracted from HTML if not provided)
        author:
          type: string
          description: Article author (optional, extracted from HTML if not provided)
        published_at:
          type: string
          format: date-time
          description: Publication date (optional, extracted from HTML if not provided)
        source_feed_id:
          type: string
          format: uuid
          description: ID of the source RSS feed (optional, null for manually added content)

    UpdateContentRequest:
      type: object
      properties:
        html:
          type: string
          description: Updated raw HTML content
          maxLength: 5242880  # 5MB
        title:
          type: string
          description: Updated article title
        author:
          type: string
          description: Updated article author
        published_at:
          type: string
          format: date-time
          description: Updated publication date
        content_hash:
          type: string
          description: SHA-256 hash of cleaned content

    ContentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Content ID
        title:
          type: string
          description: Article title
        author:
          type: string
          description: Article author
        source_url:
          type: string
          format: uri
          description: Original article URL
        canonical_url:
          type: string
          format: uri
          description: Canonicalized URL
        cleaned_html:
          type: string
          description: Sanitized and readable HTML content
        content_hash:
          type: string
          description: SHA-256 hash of cleaned content
        published_at:
          type: string
          format: date-time
          description: Publication date
        source_feed_id:
          type: string
          format: uuid
          description: Source RSS feed ID (null for manually added)
        created_at:
          type: string
          format: date-time
          description: Content creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Content last update timestamp

    BulkCreateContentRequest:
      type: object
      required:
        - contents
      properties:
        contents:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CreateContentRequest'

    BulkCreateContentResponse:
      type: object
      properties:
        success_count:
          type: integer
          description: Number of successfully created/updated items
        failure_count:
          type: integer
          description: Number of failed items
        results:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: Index in the input array
              success:
                type: boolean
                description: Whether the operation succeeded
              content_id:
                type: string
                format: uuid
                description: Created/updated content ID (present if success=true)
              error:
                type: string
                description: Error message (present if success=false)

    CheckDuplicatesRequest:
      type: object
      required:
        - feed_id
        - content_hashes
      properties:
        feed_id:
          type: string
          format: uuid
          description: Feed ID to check duplicates for
        content_hashes:
          type: array
          items:
            type: string
          description: Array of content hashes to check

    CheckDuplicatesResponse:
      type: object
      properties:
        duplicates:
          type: array
          items:
            type: object
            properties:
              content_hash:
                type: string
                description: Content hash
              content_id:
                type: string
                format: uuid
                description: Existing content ID
              exists:
                type: boolean
                description: Whether content exists

    URLType:
      type: string
      enum: [feed, page, unknown]
      description: |
        Type of URL:
        - feed: RSS/Atom feed
        - page: Web page/article
        - unknown: Could not determine (timeout or error)

    DetectURLRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: URL to detect type for

    DetectURLResponse:
      type: object
      required:
        - url
        - type
        - title
      properties:
        url:
          type: string
          format: uri
          description: The URL that was checked (may differ if redirected)
        type:
          $ref: '#/components/schemas/URLType'
        title:
          type: string
          nullable: true
          description: Feed or page title if detected, null otherwise

    AddContentToUserRequest:
      type: object
      oneOf:
        - required: [url]
        - required: [content_id]
      properties:
        # URL-based submission (recommended)
        url:
          type: string
          format: uri
          description: URL to add (feed or page)
        type:
          $ref: '#/components/schemas/URLType'
          description: Optional type hint from detection
        title:
          type: string
          description: Optional pre-detected title

        # Content-ID-based submission (legacy)
        content_id:
          type: string
          format: uuid
          description: Content ID to add (legacy mode)

        # Common metadata
        status:
          type: string
          enum: [unread, reading, completed, archived]
          description: Initial reading status (default unread)
        scroll_position:
          type: integer
          minimum: 0
          description: Initial scroll position
        is_favorite:
          type: boolean
          description: Initial favorite flag

    AddFeedResponse:
      type: object
      required:
        - type
        - feed_id
        - subscription
      properties:
        type:
          type: string
          enum: [feed]
          description: Always "feed"
        feed_id:
          type: string
          format: uuid
          description: Feed ID
        subscription:
          type: object
          required:
            - id
            - user_id
            - feed_id
            - feed_url
            - title
            - subscribed_at
          properties:
            id:
              type: string
              format: uuid
              description: Subscription ID
            user_id:
              type: string
              format: uuid
              description: User ID
            feed_id:
              type: string
              format: uuid
              description: Feed ID
            feed_url:
              type: string
              format: uri
              description: Feed URL
            title:
              type: string
              description: Feed title
            subscribed_at:
              type: string
              format: date-time
              description: Subscription timestamp

    AddPageResponse:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum: [page]
          description: Always "page"
        content:
          $ref: '#/components/schemas/UserContentResponse'

    UpdateUserContentRequest:
      type: object
      properties:
        status:
          type: string
          enum: [unread, reading, completed, archived]
          description: Reading status
        scroll_position:
          type: integer
          minimum: 0
          description: Scroll position in the article
        is_favorite:
          type: boolean
          description: Favorite flag

    UserContentResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: User ID
        content_id:
          type: string
          format: uuid
          description: Content ID
        status:
          type: string
          enum: [unread, reading, completed, archived]
          description: Reading status
        scroll_position:
          type: integer
          description: Scroll position
        is_favorite:
          type: boolean
          description: Favorite flag
        added_at:
          type: string
          format: date-time
          description: When content was added to user's list
        last_accessed_at:
          type: string
          format: date-time
          description: Last access timestamp
        content:
          $ref: '#/components/schemas/ContentResponse'

    ListUserContentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserContentResponse'
        next_cursor:
          type: string
          description: Cursor for next page (null if no more pages)
        has_more:
          type: boolean
          description: Whether there are more results

    SearchUserContentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserContentResponse'
        total:
          type: integer
          description: Total number of search results

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
