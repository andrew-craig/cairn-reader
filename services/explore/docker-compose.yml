version: '3.8'

services:
  # Recommender database (articles, users, votes)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_RECOMMENDER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RECOMMENDER}
      POSTGRES_DB: ${POSTGRES_DB_RECOMMENDER}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./recommender/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fetcher database (feeds, fetch history)
  fetcher_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_FETCHER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_FETCHER}
      POSTGRES_DB: ${POSTGRES_DB_FETCHER}
    ports:
      - "5433:5432"  # Different port to avoid conflict with recommender DB
    volumes:
      - fetcher_postgres_data:/var/lib/postgresql/data
      - ./fetcher/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fetcher -d fetcher_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  recommender:
    build:
      context: .
      dockerfile: recommender/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RECOMMENDER}
      - DB_PASSWORD=${DB_PASSWORD_RECOMMENDER}
      - DB_NAME=${POSTGRES_DB_RECOMMENDER}
      - DB_SSLMODE=disable  # Disable SSL for local development
      - ARTICLE_RETENTION_DAYS=90  # Delete articles after 90 days
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fetcher:
    build:
      context: .
      dockerfile: fetcher/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RECOMMENDER_URL=http://recommender:8081
      - FETCH_INTERVAL=60  # 60 seconds = 1 feed per minute
      - FETCH_TIMEOUT=30   # 30 seconds timeout for each feed fetch
      - MAX_FETCH_ERRORS=10  # Disable feed after 10 consecutive failures
      - DB_HOST=fetcher_db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_FETCHER}
      - DB_PASSWORD=${DB_PASSWORD_FETCHER}
      - DB_NAME=${POSTGRES_DB_FETCHER}
      - DB_SSLMODE=disable  # Disable SSL for local development
      - KAGI_FEED_URL=https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt
    depends_on:
      fetcher_db:
        condition: service_healthy
      recommender:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  fetcher_postgres_data:
