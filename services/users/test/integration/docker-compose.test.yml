version: '3.8'

services:
  # PostgreSQL for integration tests
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cairn_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: cairn_users_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn_test -d cairn_users_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ../../migrations:/docker-entrypoint-initdb.d
    networks:
      - test-network

  # HashiCorp Vault for integration tests
  test-vault:
    image: hashicorp/vault:latest
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=test-root-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    ports:
      - "8201:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Vault initializer for tests
  # Builds the same image used by dev/prod (openssl pre-installed, runs
  # as the unprivileged `vault` user) instead of `apk add`-ing at runtime.
  test-vault-init:
    build:
      context: ../../../../infrastructure/docker/vault-init
    depends_on:
      test-vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://test-vault:8200
      - VAULT_TOKEN=test-root-token
    volumes:
      - ./scripts/init-test-vault.sh:/init-vault.sh:ro
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
