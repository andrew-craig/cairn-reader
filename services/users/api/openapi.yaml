openapi: 3.0.3
info:
  title: Cairn User Service API
  version: 1.0.0
  description: |
    User authentication and account management service for Cairn.

    ## Features
    - Email/password authentication
    - Mobile device authentication (Expo device ID)
    - JWT-based stateless authentication with RS256 signing
    - Refresh token management with automatic rotation
    - Account upgrade from mobile-only to hybrid (email + device)
    - Email verification (token generation and consumption; no email is sent yet)
    - User profile management

    ## Response Envelope
    Successful responses wrap the payload: `{"data": <payload>, "meta": {"timestamp", "version"}}`.
    Error responses use `{"error": "<code>", "message": "...", "details"?, "meta"}`, where `error` is a
    machine-readable code (`bad_request`, `validation_error`, `unauthorized`, `forbidden`, `not_found`,
    `conflict`, `too_many_requests`, `internal_error`). Exceptions: the health endpoints, the rate
    limiter's 429 and the HTTPS-required 403 return their own bare shapes (see the `RateLimitError` schema
    and the `/api/v1` HTTPS note below).

    ## Account Types
    - **Mobile-only**: Created with Expo device ID, can only authenticate with device
    - **Email-only**: Created with email/password, can only authenticate with credentials
    - **Hybrid**: Upgraded from mobile-only, can authenticate with email/password (device login disabled)

    ## Authentication Flow
    1. Register or login to receive access_token and refresh_token
    2. Include access_token in Authorization header: `Bearer <access_token>`
    3. When access_token expires, use refresh_token to get a new one
    4. Refresh tokens are automatically rotated on each use

    Access-token lifetime and refresh-token lifetime are configurable (`JWT_ACCESS_TOKEN_EXPIRY`,
    `JWT_REFRESH_TOKEN_EXPIRY`); the standalone service defaults are 60 minutes and 30 days, the
    self-host binary defaults are 15 minutes and 7 days. `expires_in` in auth responses is authoritative.

    ## Security
    - Passwords hashed with bcrypt (cost factor 12+)
    - JWT tokens signed with RS256 (2048-bit RSA keys)
    - Rate limiting on `/api/v1/auth/*` endpoints, per client IP (standalone default 100 requests/minute via
      `RATE_LIMIT_REQUESTS`/`RATE_LIMIT_WINDOW`; self-host binary 10 requests/minute). Exceeding it returns 429.
    - Account lockout: 5 consecutive failed email/password logins lock the account for 15 minutes (login returns 429)
    - All `/api/v1` routes reject non-HTTPS requests with 403 `{"error": "HTTPS required"}` unless the request is
      TLS or carries `X-Forwarded-Proto: https`
    - Request bodies are limited to 16KB (413)
    - Authorization checks ensure users can only access their own data
  contact:
    name: Cairn API Support
    url: https://github.com/andrew-craig/cairn-reader
  license:
    name: MIT

servers:
  - url: http://localhost:8082
    description: User service (local development; host port 8082, container port 8080)
  - url: https://api.cairn.example.com
    description: Production server (HTTPS required)

tags:
  - name: Health
    description: Health check and readiness endpoints
  - name: Authentication
    description: User registration, login, token management and email verification
  - name: User Management
    description: User profile and account operations (requires authentication)

paths:
  # Health Endpoints
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Basic health check endpoint (liveness probe)
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                    description: Service version (omitted when empty)

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: |
        Checks if the service is ready to accept requests (readiness probe).
        Verifies database connectivity, and Vault connectivity when a Vault client is configured.
        GET and HEAD are supported on both health endpoints.
      operationId: readyCheck
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                    example:
                      database: ok
                      vault: ok
        '503':
          description: A dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: unhealthy
                  checks:
                    type: object
                    additionalProperties:
                      type: string
                    example:
                      database: error
                  message:
                    type: string
                    example: One or more dependencies are unavailable

  # Authentication Endpoints
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register with email/password
      description: |
        Creates a new email-only account.
        Email must be a valid RFC 5322 address (no display name) with a dotted domain.
        Password must be at least 8 characters (`MIN_PASSWORD_LENGTH`); the standalone service also requires
        upper, lower, digit and special characters by default (`REQUIRE_PASSWORD_COMPLEXITY`, off in the self-host binary).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: User's password (min 8 characters; complexity rules per the description above)
                  example: SecurePass123!
              required:
                - email
                - password
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Invalid input, invalid email format, or weak password (complexity failures use code `validation_error`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Account with these credentials already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register/mobile:
    post:
      tags:
        - Authentication
      summary: Register with mobile device ID
      description: |
        Creates a new mobile-only account using Expo device ID. The device ID is stored as a credential and is never returned.
        Device info and IP address are extracted from request headers.
      operationId: registerMobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expo_device_id:
                  type: string
                  description: Expo Application Installation ID
                  example: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
              required:
                - expo_device_id
      responses:
        '201':
          description: Mobile user registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Account with these credentials already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email/password
      description: |
        Authenticates a user with email and password.
        Returns access token and refresh token.
        After 5 consecutive failed attempts the account is locked for 15 minutes.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123!
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Account temporarily locked after repeated failures (message includes minutes remaining), or per-IP rate limit exceeded (`RateLimitError` shape)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/RateLimitError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login/mobile:
    post:
      tags:
        - Authentication
      summary: Login with mobile device ID
      description: |
        Authenticates a mobile-only user with Expo device ID.
        Note: Hybrid accounts cannot use device login.
      operationId: loginMobile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expo_device_id:
                  type: string
                  description: Expo Application Installation ID
                  example: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
              required:
                - expo_device_id
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Device login not allowed for hybrid accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: |
        Exchange a refresh token for a new access token.
        The refresh token is automatically rotated (a new one is issued).

        **Token Reuse Detection**: If a refresh token is reused after rotation,
        all tokens for that user are revoked as a security measure.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to exchange (opaque random string, not a JWT)
                  example: k3J9x0Qm1vT8bq2l7Zs4dH6yUe5nWcA1oPfRgXiLhMa
              required:
                - refresh_token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnvelope'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid, expired, or reused refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                expired:
                  value:
                    error: unauthorized
                    message: "refresh token has expired"
                reuse:
                  value:
                    error: unauthorized
                    message: "token reuse detected - all tokens have been revoked"
                invalid:
                  value:
                    error: unauthorized
                    message: "invalid credentials"
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout (revoke refresh token)
      description: Revokes a specific refresh token, logging out from one device
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to revoke
                  example: k3J9x0Qm1vT8bq2l7Zs4dH6yUe5nWcA1oPfRgXiLhMa
              required:
                - refresh_token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageEnvelope'
                example:
                  data:
                    message: successfully logged out
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Logout from all devices
      description: |
        Revokes all refresh tokens for the authenticated user.
        Requires JWT authentication.
      operationId: logoutAll
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out from all devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageEnvelope'
                example:
                  data:
                    message: successfully logged out from all devices
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email (JSON body)
      description: |
        Consumes an email verification token and marks the account's email as verified.
        Tokens are valid for 24 hours and single-use. If a `token` query parameter is present it takes
        precedence over the request body. No authentication required.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Verification token
              required:
                - token
      responses:
        '200':
          description: Email verified; returns the updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Missing token, or invalid/expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Authentication
      summary: Verify email (link)
      description: Same as the POST variant, taking the token from the query string (for links sent in verification emails).
      operationId: verifyEmailLink
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified; returns the updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Missing token, or invalid/expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend verification email
      description: |
        Generates a new verification token for the authenticated user's own account (no request body).
        Email delivery is not implemented yet: the token is stored but nothing is sent.
      operationId: resendVerification
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verification token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          description: Account has no email (mobile-only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - missing or invalid JWT token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email is already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User Management Endpoints
  /api/v1/user/{user_id}:
    get:
      tags:
        - User Management
      summary: Get user profile
      description: |
        Retrieves user profile information.
        Users can only access their own profile.
      operationId: getUser
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID (must match authenticated user)
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - can only access own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags:
        - User Management
      summary: Update user profile
      description: |
        Updates user profile information (currently only email). `email` is required in practice: an empty body
        returns 400 "no fields to update". Email must be a valid RFC 5322 address.
        Users can only update their own profile.
      operationId: updateUser
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID (must match authenticated user)
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: New email address
                  example: newemail@example.com
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Invalid input, invalid email format, or no fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - can only update own profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - User Management
      summary: Delete user account
      description: |
        Deletes the user account and all associated data.
        Users can only delete their own account.
        This action is irreversible.
      operationId: deleteUser
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID (must match authenticated user)
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User account deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageEnvelope'
                example:
                  data:
                    message: user account successfully deleted
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - can only delete own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/user/{user_id}/upgrade:
    post:
      tags:
        - User Management
      summary: Upgrade mobile-only account
      description: |
        Upgrades a mobile-only account to a hybrid account by adding email/password.
        After upgrade, the account can authenticate with email/password.
        Device login is disabled for hybrid accounts.
      operationId: upgradeAccount
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID (must match authenticated user)
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to add
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: Password (min 8 characters; same policy as registration)
                  example: SecurePass123!
              required:
                - email
                - password
      responses:
        '200':
          description: Account upgraded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          description: Invalid input, weak password, or not a mobile-only account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - can only upgrade own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/user/{user_id}/password:
    put:
      tags:
        - User Management
      summary: Change password
      description: |
        Changes the authenticated user's password.
        Requires the current password for verification.
        New password must meet the same strength policy as registration (min 8 characters; complexity per configuration).
      operationId: changePassword
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID (must match authenticated user)
          schema:
            type: string
            format: uuid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  format: password
                  description: Current password for verification
                  example: OldPass123!
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  description: New password (min 8 characters; same policy as registration)
                  example: NewSecurePass456!
              required:
                - current_password
                - new_password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageEnvelope'
                example:
                  data:
                    message: password changed successfully
        '400':
          description: Missing fields, weak password (`validation_error`), or account has no password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized or incorrect current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - can only change own password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large (max 16KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from authentication endpoints.
        Include in Authorization header: `Bearer <access_token>`

        The JWT contains:
        - user_id: UUID of the authenticated user
        - exp: Expiration timestamp
        The public key used to verify tokens is held in Vault; the service exposes no JWKS endpoint.

        Access token lifetime is configurable (standalone default 60 minutes, self-host default 15 minutes).

  schemas:
    User:
      type: object
      description: User account information
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
          example: 123e4567-e89b-12d3-a456-426614174000
        email:
          type: string
          format: email
          description: User email (omitted for mobile-only accounts)
          example: user@example.com
        email_verified:
          type: boolean
          description: Whether the email address has been verified
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
          example: "2025-12-29T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2025-12-29T10:00:00Z"
        last_login_at:
          type: string
          format: date-time
          description: Last login timestamp (omitted if the user has never logged in)
          example: "2025-12-29T12:30:00Z"
      required:
        - id
        - email_verified
        - created_at
        - updated_at

    AuthResponse:
      type: object
      description: Authentication response with tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
          description: JWT access token (lifetime per `expires_in`)
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Opaque refresh token (random 256-bit string, not a JWT; lifetime configurable)
          example: k3J9x0Qm1vT8bq2l7Zs4dH6yUe5nWcA1oPfRgXiLhMa
        expires_in:
          type: integer
          format: int64
          description: Access token expiration time in seconds
          example: 3600
      required:
        - user
        - access_token
        - refresh_token
        - expires_in

    Meta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: v1
      required:
        - timestamp
        - version

    AuthEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthResponse'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta

    UserEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta

    MessageEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
          required:
            - message
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - data
        - meta

    RateLimitError:
      type: object
      description: Per-IP rate limit exceeded on /api/v1/auth/*; also sets X-RateLimit-Limit and X-RateLimit-Window headers
      properties:
        error:
          type: string
          example: rate limit exceeded
        retry_after:
          type: string
          description: Window duration (Go duration string)
          example: 1m0s
      required:
        - error
        - retry_after

    Error:
      type: object
      description: Standard error response
      properties:
        error:
          type: string
          description: Machine-readable error code
          enum:
            - bad_request
            - validation_error
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - too_many_requests
            - internal_error
          example: bad_request
        message:
          type: string
          description: Human-readable error message
          example: invalid email format
        details:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/Meta'
      required:
        - error
        - message
        - meta
