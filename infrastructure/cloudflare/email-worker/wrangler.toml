name = "cairn-email-ingest"
main = "src/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Email Routing → Routes → Send to Worker is configured in the Cloudflare
# dashboard. Point all routes for read.cairnapp.com at this worker.

# Secrets (set via `wrangler secret put`, never committed):
#   INGEST_API_URL  - Full URL of the ingest endpoint
#   INGEST_API_KEY  - Must match a row in the email_ingest service's `api_keys`
#                    table (SHA-256 of the raw key is what the service stores)
