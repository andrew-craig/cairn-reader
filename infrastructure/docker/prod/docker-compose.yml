name: cairn-prod
# Production Docker Compose file using published images from GitHub Container Registry
# This file demonstrates how to deploy using pre-built images instead of building locally

services:
  # HashiCorp Vault - Secrets Management
  # NOTE: Port 8200 is NOT exposed to host in production for security
  # Access Vault only through the Docker network
  vault:
    image: hashicorp/vault:latest
    # Port intentionally NOT exposed to host - access only via Docker network
    # Uncomment below ONLY for debugging (not recommended in production)
    # ports:
    #   - "8200:8200"
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://vault:8200
      - SKIP_SETCAP=true
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
      - ../vault-config:/vault/config
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        chown -R vault:vault /vault/data
        exec /usr/local/bin/docker-entrypoint.sh vault server -config=/vault/config/vault.hcl
    healthcheck:
      # vault status exits 0 when unsealed (healthy), 2 when sealed (unhealthy).
      # This ensures dependent services only start once Vault is fully unsealed.
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    networks:
      - cairn-network

  # Vault Initializer - Sets up AppRoles and JWT keys on startup
  # This runs once and creates scoped credentials for each service.
  # Uses service_started (not service_healthy) because vault-init is responsible
  # for the initial unseal - it cannot wait for Vault to be healthy first.
  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_started
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_SKIP_VERIFY=true
    volumes:
      - ../scripts/init-vault-prod.sh:/init-vault-prod.sh:ro
      - ../vault-config/policies:/vault/policies:ro
      - vault-keys:/vault-keys
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl grep && /bin/sh /init-vault-prod.sh"]
    restart: "no"
    networks:
      - cairn-network

  # Vault Unseal Watchdog - Automatically unseals Vault after every restart/reboot
  # vault-init (restart: "no") only runs once. This service handles unsealing
  # on all subsequent reboots using keys written to the vault-keys volume.
  # Stays running as a watchdog to detect and recover from unexpected seal events.
  #
  # Security note: Unseal keys are stored in plaintext in the vault-keys volume.
  # For higher security, consider Vault Transit auto-unseal or a cloud KMS.
  vault-unseal:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_SKIP_VERIFY=true
    volumes:
      - ../scripts/unseal-vault.sh:/unseal-vault.sh:ro
      - vault-keys:/vault-keys:ro
    entrypoint: ["/bin/sh", "/unseal-vault.sh"]
    restart: unless-stopped
    networks:
      - cairn-network

  # Consolidated PostgreSQL Database
  # Single container hosting all service databases (separate logical DBs)
  cairn-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-cairn_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER_USERS: ${POSTGRES_USER_USERS}
      POSTGRES_PASSWORD_USERS: ${POSTGRES_PASSWORD_USERS}
      POSTGRES_DB_USERS: ${POSTGRES_DB_USERS}
      POSTGRES_USER_RECOMMENDER: ${POSTGRES_USER_RECOMMENDER}
      POSTGRES_PASSWORD_RECOMMENDER: ${POSTGRES_PASSWORD_RECOMMENDER}
      POSTGRES_DB_RECOMMENDER: ${POSTGRES_DB_RECOMMENDER}
      POSTGRES_USER_FETCHER: ${POSTGRES_USER_FETCHER}
      POSTGRES_PASSWORD_FETCHER: ${POSTGRES_PASSWORD_FETCHER}
      POSTGRES_DB_FETCHER: ${POSTGRES_DB_FETCHER}
      POSTGRES_USER_CONTENT: ${POSTGRES_USER_CONTENT}
      POSTGRES_PASSWORD_CONTENT: ${POSTGRES_PASSWORD_CONTENT}
      POSTGRES_DB_CONTENT: ${POSTGRES_DB_CONTENT}
      POSTGRES_USER_RSS: ${POSTGRES_USER_RSS}
      POSTGRES_PASSWORD_RSS: ${POSTGRES_PASSWORD_RSS}
      POSTGRES_DB_RSS: ${POSTGRES_DB_RSS}
    ports:
      - "5432:5432"
    volumes:
      - cairn_db_data:/var/lib/postgresql/data
      - ../scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-cairn_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cairn-network

  # User Service - Authentication and account management
  # Using published image from GitHub Container Registry
  # Authenticates to Vault using AppRole (not root token)
  user-service:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-user-service:${IMAGE_TAG:-latest}
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_USERS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_USERS}
      - DB_NAME=${POSTGRES_DB_USERS}
      # Vault AppRole authentication (scoped to user-service policy)
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID=${USER_SERVICE_ROLE_ID}
      - VAULT_SECRET_ID=${USER_SERVICE_SECRET_ID}
      - VAULT_AUTH_PATH=approle
      - JWT_PRIVATE_KEY_PATH=secret/data/jwt/private-key
      - JWT_PUBLIC_KEY_PATH=secret/data/jwt/public-key
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=7d
      - ENVIRONMENT=production
    depends_on:
      cairn-db:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Explore Recommender Service - Article storage and recommendations
  # Using published image from GitHub Container Registry
  # Authenticates to Vault using AppRole (read-only public key access)
  explore-recommender:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-explore-recommender:${IMAGE_TAG:-latest}
    ports:
      - "8087:8081"
    environment:
      - PORT=8081
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RECOMMENDER}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RECOMMENDER}
      - DB_NAME=${POSTGRES_DB_RECOMMENDER}
      - DB_SSLMODE=disable
      - ARTICLE_RETENTION_DAYS=90
      # Vault AppRole authentication (scoped to explore-recommender policy - public key only)
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID=${EXPLORE_RECOMMENDER_ROLE_ID}
      - VAULT_SECRET_ID=${EXPLORE_RECOMMENDER_SECRET_ID}
      - VAULT_AUTH_PATH=approle
      - JWT_PUBLIC_KEY_PATH=secret/data/jwt/public-key
    depends_on:
      cairn-db:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Explore Fetcher Service - RSS feed fetching for discovery
  # Using published image from GitHub Container Registry
  explore-fetcher:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-explore-fetcher:${IMAGE_TAG:-latest}
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - RECOMMENDER_URL=http://explore-recommender:8081
      - FETCH_INTERVAL=60
      - FETCH_TIMEOUT=30
      - MAX_FETCH_ERRORS=10
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_FETCHER}
      - DB_PASSWORD=${POSTGRES_PASSWORD_FETCHER}
      - DB_NAME=${POSTGRES_DB_FETCHER}
      - DB_SSLMODE=disable
      - KAGI_FEED_URL=https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt
    depends_on:
      cairn-db:
        condition: service_healthy
      explore-recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Content Service - Article content storage and management
  # Using published image from GitHub Container Registry
  content-service:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-content-service:${IMAGE_TAG:-latest}
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_CONTENT}
      - DB_PASSWORD=${POSTGRES_PASSWORD_CONTENT}
      - DB_NAME=${POSTGRES_DB_CONTENT}
      - DB_SSLMODE=disable
      - INGEST_RSS_SERVICE_URL=http://ingest-rss:8081
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # Vault AppRole authentication (scoped to content-service policy)
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID=${CONTENT_SERVICE_ROLE_ID}
      - VAULT_SECRET_ID=${CONTENT_SERVICE_SECRET_ID}
      - VAULT_AUTH_PATH=approle
    depends_on:
      cairn-db:
        condition: service_healthy
      ingest-rss:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Content Service Worker - Background jobs for content cleanup
  # Using published image from GitHub Container Registry
  content-worker:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-content-worker:${IMAGE_TAG:-latest}
    environment:
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_CONTENT}
      - DB_PASSWORD=${POSTGRES_PASSWORD_CONTENT}
      - DB_NAME=${POSTGRES_DB_CONTENT}
      - DB_SSLMODE=disable
      - CLEANUP_CRON=0 2 * * *
      - HEALTH_PORT=8084
    ports:
      - "8084:8084"
    depends_on:
      cairn-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cairn-network

  # Ingest RSS Service - Feed subscription and polling
  # Using published image from GitHub Container Registry
  ingest-rss:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-ingest-rss:${IMAGE_TAG:-latest}
    ports:
      - "8085:8081"
    environment:
      - PORT=8081
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RSS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RSS}
      - DB_NAME=${POSTGRES_DB_RSS}
      - DB_SSLMODE=disable
    depends_on:
      cairn-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Ingest RSS Worker - Background jobs for feed polling and processing
  # Using published image from GitHub Container Registry
  ingest-rss-worker:
    image: ghcr.io/${GITHUB_ORG:-cairn-app}/cairn-ingest-rss-worker:${IMAGE_TAG:-latest}
    environment:
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RSS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RSS}
      - DB_NAME=${POSTGRES_DB_RSS}
      - DB_SSLMODE=disable
      - CONTENT_SERVICE_URL=http://content-service:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - HEALTH_PORT=8086
      - OUTBOX_CLEANUP_CRON=0 3 * * *
      - FEED_ITEMS_CLEANUP_CRON=0 4 * * *
    ports:
      - "8086:8086"
    depends_on:
      cairn-db:
        condition: service_healthy
      content-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cairn-network

volumes:
  cairn_db_data:
  vault-keys:
  vault-data:

networks:
  cairn-network:
    driver: bridge
