services:
  # HashiCorp Vault - Secrets management
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn-network

  # Vault Initializer - Populates Vault with JWT keys on startup
  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
    volumes:
      - ./scripts/init-vault.sh:/init-vault.sh
      - vault-keys:/vault-keys
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && /bin/sh /init-vault.sh"]
    networks:
      - cairn-network

  # User Service Database
  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_USERS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_USERS}
      POSTGRES_DB: ${POSTGRES_DB_USERS}
    ports:
      - "5432:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data
      - ../../services/users/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_USERS} -d ${POSTGRES_DB_USERS}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn-network

  # Recommender Service Database
  recommender-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_RECOMMENDER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_RECOMMENDER}
      POSTGRES_DB: ${POSTGRES_DB_RECOMMENDER}
    ports:
      - "5433:5432"
    volumes:
      - recommender_db_data:/var/lib/postgresql/data
      - ../../services/explore/recommender/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_RECOMMENDER} -d ${POSTGRES_DB_RECOMMENDER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn-network

  # Fetcher Service Database
  fetcher-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_FETCHER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_FETCHER}
      POSTGRES_DB: ${POSTGRES_DB_FETCHER}
    ports:
      - "5434:5432"
    volumes:
      - fetcher_db_data:/var/lib/postgresql/data
      - ../../services/explore/fetcher/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_FETCHER} -d ${POSTGRES_DB_FETCHER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn-network

  # User Service - Authentication and account management
  user-service:
    build:
      context: ../../services
      dockerfile: users/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DB_HOST=users-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_USERS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_USERS}
      - DB_NAME=${POSTGRES_DB_USERS}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
      - JWT_ACCESS_LIFETIME=15m
      - JWT_REFRESH_LIFETIME=7d
      - SERVER_ENVIRONMENT=development
    depends_on:
      users-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Recommender Service - Article storage and recommendations
  recommender:
    build:
      context: ../../services
      dockerfile: explore/recommender/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=recommender-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RECOMMENDER}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RECOMMENDER}
      - DB_NAME=${POSTGRES_DB_RECOMMENDER}
      - DB_SSLMODE=disable
      - ARTICLE_RETENTION_DAYS=90
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
      - JWT_PUBLIC_KEY_PATH=secret/data/jwt/public-key
    depends_on:
      recommender-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Fetcher Service - RSS feed fetching
  fetcher:
    build:
      context: ../../services
      dockerfile: explore/fetcher/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RECOMMENDER_URL=http://recommender:8081
      - FETCH_INTERVAL=60
      - FETCH_TIMEOUT=30
      - MAX_FETCH_ERRORS=10
      - DB_HOST=fetcher-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_FETCHER}
      - DB_PASSWORD=${POSTGRES_PASSWORD_FETCHER}
      - DB_NAME=${POSTGRES_DB_FETCHER}
      - DB_SSLMODE=disable
      - KAGI_FEED_URL=https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt
    depends_on:
      fetcher-db:
        condition: service_healthy
      recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

volumes:
  users_db_data:
  recommender_db_data:
  fetcher_db_data:
  vault-keys:

networks:
  cairn-network:
    driver: bridge
