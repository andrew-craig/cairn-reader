services:
  # HashiCorp Vault - Secrets management
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-token
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn-network

  # Vault Initializer - Populates Vault with JWT keys on startup
  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-token
    volumes:
      - ./scripts/init-vault.sh:/init-vault.sh
      - vault-keys:/vault-keys
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl && /bin/sh /init-vault.sh"]
    networks:
      - cairn-network

  # PostgreSQL Database - Single instance for all services
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: cairn_password
      POSTGRES_DB: postgres  # Default database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/docker-entrypoint-initdb.d/00-init.sh
      - ../../services/users/migrations:/docker-entrypoint-initdb.d/user-migrations
      - ../../services/explore/recommender/migrations:/docker-entrypoint-initdb.d/recommender-migrations
      - ../../services/explore/fetcher/migrations:/docker-entrypoint-initdb.d/fetcher-migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cairn-network

  # User Service - Authentication and account management
  user-service:
    build:
      context: ../../services
      dockerfile: users/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cairn
      - DB_PASSWORD=cairn_password
      - DB_NAME=cairn_users
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-token
      - JWT_ACCESS_LIFETIME=15m
      - JWT_REFRESH_LIFETIME=7d
      - SERVER_ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Recommender Service - Article storage and recommendations
  recommender:
    build:
      context: ../../services
      dockerfile: explore/recommender/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cairn
      - DB_PASSWORD=cairn_password
      - DB_NAME=cairn_recommender
      - ARTICLE_RETENTION_DAYS=90
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=dev-token
      - JWT_PUBLIC_KEY_PATH=secret/data/jwt/public-key
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Fetcher Service - RSS feed fetching
  fetcher:
    build:
      context: ../../services
      dockerfile: explore/fetcher/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RECOMMENDER_URL=http://recommender:8081
      - FETCH_INTERVAL=60
      - FETCH_TIMEOUT=30
      - MAX_FETCH_ERRORS=10
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=cairn
      - DB_PASSWORD=cairn_password
      - DB_NAME=cairn_fetcher
      - KAGI_FEED_URL=https://raw.githubusercontent.com/kagisearch/smallweb/main/smallweb.txt
    depends_on:
      postgres:
        condition: service_healthy
      recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

volumes:
  postgres_data:
  vault-keys:

networks:
  cairn-network:
    driver: bridge
