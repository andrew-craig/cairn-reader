name: cairn
services:
  # HashiCorp Vault - Secrets management
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_DEV_ROOT_TOKEN_ID}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Vault Initializer - Populates Vault with JWT keys on startup
  # Uses a purpose-built image (../vault-init) that bakes in the required
  # CLI tools (openssl, grep) at build time and runs as the unprivileged
  # `vault` user, instead of installing them at runtime as root.
  vault-init:
    build:
      context: ../vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
    volumes:
      - ../scripts/init-vault.sh:/init-vault.sh:ro
      - vault-keys:/vault-keys
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    restart: "no"
    networks:
      - cairn-network

  # Consolidated PostgreSQL Database
  # Single container hosting all service databases (separate logical DBs)
  cairn-db:
    image: postgres:18-alpine
    environment:
      # Superuser for the container (used by init script)
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # Passed to init-databases.sh to create per-service DBs and users
      POSTGRES_USER_USERS: ${POSTGRES_USER_USERS}
      POSTGRES_PASSWORD_USERS: ${POSTGRES_PASSWORD_USERS}
      POSTGRES_DB_USERS: ${POSTGRES_DB_USERS}
      POSTGRES_USER_RECOMMENDER: ${POSTGRES_USER_RECOMMENDER}
      POSTGRES_PASSWORD_RECOMMENDER: ${POSTGRES_PASSWORD_RECOMMENDER}
      POSTGRES_DB_RECOMMENDER: ${POSTGRES_DB_RECOMMENDER}
      POSTGRES_USER_FETCHER: ${POSTGRES_USER_FETCHER}
      POSTGRES_PASSWORD_FETCHER: ${POSTGRES_PASSWORD_FETCHER}
      POSTGRES_DB_FETCHER: ${POSTGRES_DB_FETCHER}
      POSTGRES_USER_CONTENT: ${POSTGRES_USER_CONTENT}
      POSTGRES_PASSWORD_CONTENT: ${POSTGRES_PASSWORD_CONTENT}
      POSTGRES_DB_CONTENT: ${POSTGRES_DB_CONTENT}
      POSTGRES_USER_RSS: ${POSTGRES_USER_RSS}
      POSTGRES_PASSWORD_RSS: ${POSTGRES_PASSWORD_RSS}
      POSTGRES_DB_RSS: ${POSTGRES_DB_RSS}
      POSTGRES_USER_EMAIL: ${POSTGRES_USER_EMAIL}
      POSTGRES_PASSWORD_EMAIL: ${POSTGRES_PASSWORD_EMAIL}
      POSTGRES_DB_EMAIL: ${POSTGRES_DB_EMAIL}
    ports:
      - "5432:5432"
    volumes:
      - cairn_db_data:/var/lib/postgresql/data
      - ../scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - cairn-network

  # User Service - Authentication and account management
  user-service:
    build:
      context: ../../..
      dockerfile: services/users/Dockerfile
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_USERS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_USERS}
      - DB_NAME=${POSTGRES_DB_USERS}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=7d
      - SERVER_ENVIRONMENT=development
    depends_on:
      cairn-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Explore Recommender Service - Article storage and recommendations
  explore-recommender:
    build:
      context: ../../..
      dockerfile: services/explore/recommender/Dockerfile
    ports:
      - "8087:8081"
    environment:
      - PORT=8081
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RECOMMENDER}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RECOMMENDER}
      - DB_NAME=${POSTGRES_DB_RECOMMENDER}
      - DB_SSLMODE=disable
      - ARTICLE_RETENTION_DAYS=90
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
      - JWT_PUBLIC_KEY_PATH=secret/data/jwt/public-key
    depends_on:
      cairn-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Explore Fetcher Service - RSS feed fetching for discovery
  explore-fetcher:
    build:
      context: ../../..
      dockerfile: services/explore/fetcher/Dockerfile
    ports:
      - "8088:8080"
    environment:
      - PORT=8080
      - RECOMMENDER_URL=http://explore-recommender:8081
      - FETCH_INTERVAL=60
      - FETCH_TIMEOUT=30
      - MAX_FETCH_ERRORS=10
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_FETCHER}
      - DB_PASSWORD=${POSTGRES_PASSWORD_FETCHER}
      - DB_NAME=${POSTGRES_DB_FETCHER}
      - DB_SSLMODE=disable
      # Feed list source: if a file is mounted at FEED_LIST_PATH it takes
      # precedence; otherwise the service downloads FEED_LIST_URL (the
      # repository's default curated list) at startup.
      - FEED_LIST_PATH=/app/feeds/feeds.txt
      - FEED_LIST_URL=https://raw.githubusercontent.com/cairn-app/cairn-reader/main/services/explore/feeds/default-feeds.txt
    # To override with a local feed list, add a volumes: entry such as:
    #   volumes:
    #     - ../../../services/explore/feeds/default-feeds.txt:/app/feeds/feeds.txt:ro
    depends_on:
      cairn-db:
        condition: service_healthy
      explore-recommender:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Content Service - Article content storage and management
  content-service:
    build:
      context: ../../..
      dockerfile: services/read/content/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - PORT=8080
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_CONTENT}
      - DB_PASSWORD=${POSTGRES_PASSWORD_CONTENT}
      - DB_NAME=${POSTGRES_DB_CONTENT}
      - DB_SSL_MODE=disable
      - INGEST_RSS_SERVICE_URL=http://ingest-rss:8081
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    depends_on:
      cairn-db:
        condition: service_healthy
      ingest-rss:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Content Service Worker - Background jobs for content cleanup
  content-worker:
    build:
      context: ../../..
      dockerfile: services/read/content/Dockerfile.worker
    environment:
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_CONTENT}
      - DB_PASSWORD=${POSTGRES_PASSWORD_CONTENT}
      - DB_NAME=${POSTGRES_DB_CONTENT}
      - DB_SSL_MODE=disable
      - CLEANUP_CRON=0 2 * * *
      - HEALTH_PORT=8084
    ports:
      - "8084:8084"
    depends_on:
      cairn-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8084/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cairn-network

  # Ingest RSS Service - Feed subscription and polling
  ingest-rss:
    build:
      context: ../../..
      dockerfile: services/read/fetcher/Dockerfile
    ports:
      - "8085:8081"
    environment:
      - PORT=8081
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RSS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RSS}
      - DB_NAME=${POSTGRES_DB_RSS}
      - DB_SSL_MODE=disable
    depends_on:
      cairn-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Ingest RSS Worker - Background jobs for feed polling and processing
  ingest-rss-worker:
    build:
      context: ../../..
      dockerfile: services/read/fetcher/Dockerfile.worker
    environment:
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_RSS}
      - DB_PASSWORD=${POSTGRES_PASSWORD_RSS}
      - DB_NAME=${POSTGRES_DB_RSS}
      - DB_SSL_MODE=disable
      - CONTENT_SERVICE_URL=http://content-service:8080
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - HEALTH_PORT=8086
      - OUTBOX_CLEANUP_CRON=0 3 * * *
      - FEED_ITEMS_CLEANUP_CRON=0 4 * * *
    ports:
      - "8086:8086"
    depends_on:
      cairn-db:
        condition: service_healthy
      content-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cairn-network

  # Email Ingest Service - Email newsletter ingestion API
  email-ingest:
    build:
      context: ../../..
      dockerfile: services/read/email/Dockerfile
    ports:
      - "8089:8087"
    environment:
      - PORT=8087
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_EMAIL}
      - DB_PASSWORD=${POSTGRES_PASSWORD_EMAIL}
      - DB_NAME=${POSTGRES_DB_EMAIL}
      - DB_SSL_MODE=disable
      - INGEST_API_KEY=${EMAIL_INGEST_API_KEY}
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_DEV_ROOT_TOKEN_ID}
      - JWT_PUBLIC_KEY_PATH=secret/data/jwt/public-key
      - EMAIL_DOMAIN=read.cairnapp.com
    depends_on:
      cairn-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cairn-network

  # Email Ingest Worker - Background jobs for email processing and delivery
  email-ingest-worker:
    build:
      context: ../../..
      dockerfile: services/read/email/Dockerfile.worker
    environment:
      - DB_HOST=cairn-db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER_EMAIL}
      - DB_PASSWORD=${POSTGRES_PASSWORD_EMAIL}
      - DB_NAME=${POSTGRES_DB_EMAIL}
      - DB_SSL_MODE=disable
      - CONTENT_SERVICE_URL=http://content-service:8080
      - INGEST_API_KEY=${EMAIL_INGEST_API_KEY}
      - EMAIL_DOMAIN=read.cairnapp.com
      - HEALTH_PORT=8090
    ports:
      - "8090:8090"
    depends_on:
      cairn-db:
        condition: service_healthy
      content-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cairn-network

volumes:
  cairn_db_data:
  vault-keys:

networks:
  cairn-network:
    driver: bridge
