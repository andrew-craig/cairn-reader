name: iOS TestFlight (Fastlane)

on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

jobs:
  deploy:
    name: Deploy to TestFlight
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Save fastlane config
        run: cp -r apps/mobile/ios/fastlane /tmp/fastlane-backup && cp apps/mobile/ios/Gemfile /tmp/Gemfile-backup && cp apps/mobile/ios/Gemfile.lock /tmp/Gemfile-lock-backup 2>/dev/null || true

      - name: Generate native code
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Restore fastlane config
        run: |
          cp -r /tmp/fastlane-backup apps/mobile/ios/fastlane
          cp /tmp/Gemfile-backup apps/mobile/ios/Gemfile
          cp /tmp/Gemfile-lock-backup apps/mobile/ios/Gemfile.lock 2>/dev/null || true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile/ios

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build and upload to TestFlight
        working-directory: apps/mobile/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: bundle exec fastlane beta

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/fastlane-backup /tmp/Gemfile-backup /tmp/Gemfile-lock-backup
