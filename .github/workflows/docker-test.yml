name: Docker Build Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'services/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-*.yml'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      users: ${{ steps.filter.outputs.users == 'true' || steps.filter.outputs.infra == 'true' }}
      explore: ${{ steps.filter.outputs.explore == 'true' || steps.filter.outputs.infra == 'true' }}
      read-content: ${{ steps.filter.outputs.read-content == 'true' || steps.filter.outputs.infra == 'true' }}
      read-fetcher: ${{ steps.filter.outputs.read-fetcher == 'true' || steps.filter.outputs.infra == 'true' }}
      selfhost: ${{ steps.filter.outputs.selfhost == 'true' || steps.filter.outputs.infra == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            users:
              - 'services/users/**'
            explore:
              - 'services/explore/**'
            read-content:
              - 'services/read/content/**'
              - 'services/read/internal/**'
              - 'services/read/go.mod'
              - 'services/read/go.sum'
            read-fetcher:
              - 'services/read/fetcher/**'
              - 'services/read/internal/**'
              - 'services/read/go.mod'
              - 'services/read/go.sum'
            selfhost:
              - 'cmd/selfhost/**'
              - 'pkg/**'
              - 'services/**'
              - 'infrastructure/docker/selfhost/**'
            infra:
              - 'infrastructure/docker/**'

  # ── User Service ──────────────────────────────────────────────────────

  build-user-service:
    name: Docker build (user-service)
    needs: [changes]
    if: needs.changes.outputs.users == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/users/Dockerfile
          push: false
          load: true
          tags: cairn-user-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-user-service:test --help || \
          docker run --rm cairn-user-service:test --version || \
          echo "Image built successfully"

  # ── Explore Services ──────────────────────────────────────────────────

  build-explore-recommender:
    name: Docker build (explore-recommender)
    needs: [changes]
    if: needs.changes.outputs.explore == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/explore/recommender/Dockerfile
          push: false
          load: true
          tags: cairn-explore-recommender:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-explore-recommender:test --help || \
          docker run --rm cairn-explore-recommender:test --version || \
          echo "Image built successfully"

  build-explore-fetcher:
    name: Docker build (explore-fetcher)
    needs: [changes]
    if: needs.changes.outputs.explore == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/explore/fetcher/Dockerfile
          push: false
          load: true
          tags: cairn-explore-fetcher:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-explore-fetcher:test --help || \
          docker run --rm cairn-explore-fetcher:test --version || \
          echo "Image built successfully"

  # ── Content Services ──────────────────────────────────────────────────

  build-content-service:
    name: Docker build (content-service)
    needs: [changes]
    if: needs.changes.outputs.read-content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/read/content/Dockerfile
          push: false
          load: true
          tags: cairn-content-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-content-service:test --help || \
          docker run --rm cairn-content-service:test --version || \
          echo "Image built successfully"

  build-content-worker:
    name: Docker build (content-worker)
    needs: [changes]
    if: needs.changes.outputs.read-content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/read/content/Dockerfile.worker
          push: false
          load: true
          tags: cairn-content-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-content-worker:test --help || \
          docker run --rm cairn-content-worker:test --version || \
          echo "Image built successfully"

  # ── Ingest RSS Services ───────────────────────────────────────────────

  build-ingest-rss:
    name: Docker build (ingest-rss)
    needs: [changes]
    if: needs.changes.outputs.read-fetcher == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/read/fetcher/Dockerfile
          push: false
          load: true
          tags: cairn-ingest-rss:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-ingest-rss:test --help || \
          docker run --rm cairn-ingest-rss:test --version || \
          echo "Image built successfully"

  build-ingest-rss-worker:
    name: Docker build (ingest-rss-worker)
    needs: [changes]
    if: needs.changes.outputs.read-fetcher == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/read/fetcher/Dockerfile.worker
          push: false
          load: true
          tags: cairn-ingest-rss-worker:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-ingest-rss-worker:test --help || \
          docker run --rm cairn-ingest-rss-worker:test --version || \
          echo "Image built successfully"

  # ── Selfhost (consolidated binary) ────────────────────────────────────

  build-selfhost:
    name: Docker build (selfhost)
    needs: [changes]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/selfhost/Dockerfile
          push: false
          load: true
          tags: cairn-selfhost:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image can run
        run: |
          docker run --rm cairn-selfhost:test --help || \
          docker run --rm cairn-selfhost:test --version || \
          echo "Image built successfully"

  selfhost-compose-smoke:
    name: Selfhost docker-compose smoke test
    needs: [build-selfhost]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from example
        working-directory: infrastructure/docker/selfhost
        run: |
          cp .env.example .env
          # Override password with a known test value
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_test_password/' .env
      - name: Start stack
        working-directory: infrastructure/docker/selfhost
        run: docker compose up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then
              echo "selfhost is ready"
              curl -s http://localhost:8080/health/ready
              exit 0
            fi
            echo "waiting for selfhost... ($i/60)"
            sleep 3
          done
          echo "selfhost did not become ready in time"
          docker compose -f infrastructure/docker/selfhost/docker-compose.yml logs --tail=200 cairn
          docker compose -f infrastructure/docker/selfhost/docker-compose.yml logs --tail=100 cairn-db
          exit 1
      - name: Check liveness endpoint
        run: curl -fsS http://localhost:8080/health/live
      - name: Dump container logs on failure
        if: failure()
        working-directory: infrastructure/docker/selfhost
        run: |
          docker compose ps
          docker compose logs --tail=300 cairn
          docker compose logs --tail=100 cairn-db
      - name: Stop stack
        if: always()
        working-directory: infrastructure/docker/selfhost
        run: docker compose down -v
