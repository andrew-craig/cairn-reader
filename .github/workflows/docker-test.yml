name: Docker Build Test

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'services/**'
      - 'infrastructure/docker/**'
      - '.github/workflows/docker-*.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            dockerfile: services/users/Dockerfile
            context: .

          - service: explore-recommender
            dockerfile: services/explore/recommender/Dockerfile
            context: .

          - service: explore-fetcher
            dockerfile: services/explore/fetcher/Dockerfile
            context: .

          - service: content-service
            dockerfile: services/read/content/Dockerfile
            context: .

          - service: content-worker
            dockerfile: services/read/content/Dockerfile.worker
            context: .

          - service: ingest-rss
            dockerfile: services/read/fetcher/Dockerfile
            context: .

          - service: ingest-rss-worker
            dockerfile: services/read/fetcher/Dockerfile.worker
            context: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cairn-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image can run
        run: |
          docker run --rm cairn-${{ matrix.service }}:test --help || \
          docker run --rm cairn-${{ matrix.service }}:test --version || \
          echo "Image built successfully"
