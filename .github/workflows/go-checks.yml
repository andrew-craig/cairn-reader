name: Go Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'pkg/**'
      - '.github/workflows/go-checks.yml'

jobs:
  vet:
    name: go vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/explore
          - services/read
          - services/read/email
          - services/users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
