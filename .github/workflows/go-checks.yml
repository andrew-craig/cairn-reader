name: Go Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - 'pkg/**'
      - '.github/workflows/go-checks.yml'

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l services/ pkg/)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w' on the above files to fix."
            exit 1
          fi

  lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/explore
          - services/read
          - services/read/email
          - services/users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}
          args: --timeout=5m

  vet:
    name: go vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/explore
          - services/read
          - services/read/email
          - services/users
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  build:
    name: go build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: services/explore
            build-cmd: |
              go build ./fetcher/cmd/explore_fetcher
              go build ./recommender/cmd/explore_recommender
              go build ./recommender/cmd/explore_cleanup
          - module: services/read
            build-cmd: |
              cd content && go build ./cmd/content && go build ./cmd/worker
              cd ../fetcher && go build ./cmd/ingest_rss && go build ./cmd/ingest_rss_worker
          - module: services/read/email
            build-cmd: |
              go build ./cmd/email_ingest
              go build ./cmd/email_ingest_worker
          - module: services/users
            build-cmd: |
              go build -o /dev/null ./cmd/user-service
              go build -o /dev/null ./cmd/migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Build binaries
        working-directory: ${{ matrix.module }}
        run: ${{ matrix.build-cmd }}

  test:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: services/explore
            test-cmd: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
          - module: services/read
            test-cmd: |
              cd content && go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
              cd ../fetcher && go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
          - module: services/read/email
            test-cmd: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
          - module: services/users
            test-cmd: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./internal/...
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: ${{ matrix.test-cmd }}
      - name: Coverage summary
        if: always() && !cancelled()
        working-directory: ${{ matrix.module }}
        run: |
          echo "## Coverage: ${{ matrix.module }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # Find all coverage.out files (read service has sub-dirs)
          for f in $(find . -name coverage.out -type f); do
            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              echo "--- $dir ---" >> "$GITHUB_STEP_SUMMARY"
            fi
            go tool cover -func="$f" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
