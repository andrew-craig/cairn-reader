name: Go Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'services/**'
      - 'pkg/**'
      - '.github/workflows/go-checks.yml'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      read: ${{ steps.filter.outputs.read == 'true' || steps.filter.outputs.pkg == 'true' }}
      email: ${{ steps.filter.outputs.email == 'true' || steps.filter.outputs.pkg == 'true' }}
      users: ${{ steps.filter.outputs.users == 'true' || steps.filter.outputs.pkg == 'true' }}
      pkg-auth: ${{ steps.filter.outputs.pkg-auth == 'true' }}
      pkg-rss: ${{ steps.filter.outputs.pkg-rss == 'true' }}
      pkg-middleware: ${{ steps.filter.outputs.pkg-middleware == 'true' }}
      pkg-config: ${{ steps.filter.outputs.pkg-config == 'true' }}
      pkg-logging: ${{ steps.filter.outputs.pkg-logging == 'true' }}
      selfhost: ${{ steps.filter.outputs.selfhost == 'true' || steps.filter.outputs.pkg == 'true' || steps.filter.outputs.anyservice == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            read:
              - 'services/read/**'
              - '!services/read/email/**'
            email:
              - 'services/read/email/**'
            users:
              - 'services/users/**'
            pkg:
              - 'pkg/**'
            pkg-auth:
              - 'pkg/auth/**'
            pkg-rss:
              - 'pkg/rss/**'
            pkg-middleware:
              - 'pkg/middleware/**'
            pkg-config:
              - 'pkg/config/**'
            pkg-logging:
              - 'pkg/logging/**'
            selfhost:
              - 'cmd/selfhost/**'
            anyservice:
              - 'services/**'

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd/ services/ pkg/)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w' on the above files to fix."
            exit 1
          fi

  # ── Lint ──────────────────────────────────────────────────────────────

  lint-read:
    name: golangci-lint (services/read)
    needs: [changes]
    if: needs.changes.outputs.read == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: services/read
          args: --timeout=5m

  lint-email:
    name: golangci-lint (services/read/email)
    needs: [changes]
    if: needs.changes.outputs.email == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/email/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: services/read/email
          args: --timeout=5m

  lint-users:
    name: golangci-lint (services/users)
    needs: [changes]
    if: needs.changes.outputs.users == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/users/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: services/users
          args: --timeout=5m

  # ── Vet ───────────────────────────────────────────────────────────────

  vet-read:
    name: go vet (services/read)
    needs: [changes]
    if: needs.changes.outputs.read == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/go.sum
      - name: Run go vet
        working-directory: services/read
        run: go vet ./...

  vet-email:
    name: go vet (services/read/email)
    needs: [changes]
    if: needs.changes.outputs.email == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/email/go.sum
      - name: Run go vet
        working-directory: services/read/email
        run: go vet ./...

  vet-users:
    name: go vet (services/users)
    needs: [changes]
    if: needs.changes.outputs.users == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/users/go.sum
      - name: Run go vet
        working-directory: services/users
        run: go vet ./...

  # ── Build ─────────────────────────────────────────────────────────────

  build-read:
    name: go build (services/read)
    needs: [changes]
    if: needs.changes.outputs.read == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/go.sum
      - name: Build binaries
        working-directory: services/read
        run: |
          cd content && go build ./cmd/content && go build ./cmd/worker
          cd ../fetcher && go build ./cmd/ingest_rss && go build ./cmd/ingest_rss_worker

  build-email:
    name: go build (services/read/email)
    needs: [changes]
    if: needs.changes.outputs.email == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/email/go.sum
      - name: Build binaries
        working-directory: services/read/email
        run: |
          go build ./cmd/email_ingest
          go build ./cmd/email_ingest_worker

  build-users:
    name: go build (services/users)
    needs: [changes]
    if: needs.changes.outputs.users == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/users/go.sum
      - name: Build binaries
        working-directory: services/users
        run: |
          go build -o /dev/null ./cmd/user-service
          go build -o /dev/null ./cmd/migrate

  # ── Test ──────────────────────────────────────────────────────────────

  test-read:
    name: go test (services/read)
    needs: [changes]
    if: needs.changes.outputs.read == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/go.sum
      - name: Run tests
        working-directory: services/read
        run: |
          cd content && go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
          cd ../fetcher && go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: always() && !cancelled()
        working-directory: services/read
        run: |
          echo "## Coverage: services/read" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in $(find . -name coverage.out -type f); do
            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              echo "--- $dir ---" >> "$GITHUB_STEP_SUMMARY"
            fi
            go tool cover -func="$f" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  test-integration-read:
    name: go test integration (services/read)
    needs: [changes]
    if: needs.changes.outputs.read == 'true' || needs.changes.outputs.email == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      # content/internal/service and content/internal/api/handlers have a handful of
      # integration tests that hit real external sites (nasa.gov, example.com,
      # httpstat.us) to exercise URL detection against real responses. That's a live
      # third-party dependency this required CI job shouldn't be coupled to, so they're
      # skipped here independently of -short (which would also skip the Wave 2 DB tests
      # this job exists to run).
      CAIRN_SKIP_NETWORK_TESTS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            services/read/go.sum
            services/read/email/go.sum
      - name: Run integration tests
        working-directory: services/read
        run: |
          cd content && go test -race -tags=integration -count=1 -timeout 10m ./...
          cd ../fetcher && go test -race -tags=integration -count=1 -timeout 10m ./...
          cd ../email && go test -race -tags=integration -count=1 -timeout 10m ./...

  test-email:
    name: go test (services/read/email)
    needs: [changes]
    if: needs.changes.outputs.email == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/read/email/go.sum
      - name: Run tests
        working-directory: services/read/email
        run: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: always() && !cancelled()
        working-directory: services/read/email
        run: |
          echo "## Coverage: services/read/email" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in $(find . -name coverage.out -type f); do
            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              echo "--- $dir ---" >> "$GITHUB_STEP_SUMMARY"
            fi
            go tool cover -func="$f" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  test-users:
    name: go test (services/users)
    needs: [changes]
    if: needs.changes.outputs.users == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cairn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: cairn_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/users/go.sum
      - name: Run migrations
        working-directory: services/users
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: cairn_test
          DB_SSLMODE: disable
        run: go run cmd/migrate/main.go -command=up
      - name: Run tests
        working-directory: services/users
        # -p 1: these packages all connect to the single shared Postgres
        # service container above by literal test data (emails, device
        # IDs) - running package test binaries in parallel (Go's default)
        # races them against each other and produces spurious unique
        # constraint / "already exists" failures.
        run: go test -race -p 1 -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./internal/...
      - name: Coverage summary
        if: always() && !cancelled()
        working-directory: services/users
        run: |
          echo "## Coverage: services/users" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in $(find . -name coverage.out -type f); do
            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              echo "--- $dir ---" >> "$GITHUB_STEP_SUMMARY"
            fi
            go tool cover -func="$f" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Selfhost (consolidated binary) ────────────────────────────────────

  lint-selfhost:
    name: golangci-lint (cmd/selfhost)
    needs: [changes]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/selfhost/go.sum
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: cmd/selfhost
          args: --timeout=5m

  vet-selfhost:
    name: go vet (cmd/selfhost)
    needs: [changes]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/selfhost/go.sum
      - name: Run go vet
        working-directory: cmd/selfhost
        run: go vet ./...

  build-selfhost:
    name: go build (cmd/selfhost)
    needs: [changes]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/selfhost/go.sum
      - name: Build consolidated binary
        working-directory: cmd/selfhost
        run: CGO_ENABLED=0 go build -o /tmp/cairn-selfhost .
      - name: Verify binary runs
        run: |
          # Binary exits non-zero without DB, but we just want to confirm it starts
          # and the ELF is valid. `file` confirms it's a static binary.
          file /tmp/cairn-selfhost
          test -x /tmp/cairn-selfhost

  test-selfhost:
    name: go test (cmd/selfhost)
    needs: [changes]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/selfhost/go.sum
      - name: Run tests
        working-directory: cmd/selfhost
        run: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: always() && !cancelled()
        working-directory: cmd/selfhost
        run: |
          echo "## Coverage: cmd/selfhost" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in $(find . -name coverage.out -type f); do
            dir=$(dirname "$f")
            if [ "$dir" != "." ]; then
              echo "--- $dir ---" >> "$GITHUB_STEP_SUMMARY"
            fi
            go tool cover -func="$f" | tail -1 >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  test-integration-selfhost:
    name: go test integration (cmd/selfhost)
    needs: [changes]
    if: needs.changes.outputs.selfhost == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cmd/selfhost/go.sum
      # These tests mount several services onto the master router at once, which is
      # the only place the single-binary routing collisions between them show up.
      - name: Run integration tests
        working-directory: cmd/selfhost
        run: go test -race -tags=integration -count=1 -timeout 10m ./...

  # ── Shared pkg/auth (standalone module) ──────────────────────────────

  test-pkg-auth:
    name: go test (pkg/auth)
    needs: [changes]
    if: needs.changes.outputs.pkg-auth == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: pkg/auth/go.sum
      - name: Run go vet
        working-directory: pkg/auth
        run: go vet ./...
      - name: Run tests
        working-directory: pkg/auth
        run: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: always() && !cancelled()
        working-directory: pkg/auth
        run: |
          echo "## Coverage: pkg/auth" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Other standalone pkg/* modules ───────────────────────────────────

  test-pkg:
    name: go test (pkg/${{ matrix.module }})
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: rss
            filter: pkg-rss
            sumfile: pkg/rss/go.sum
          - module: middleware
            filter: pkg-middleware
            sumfile: pkg/middleware/go.sum
          - module: config
            filter: pkg-config
            sumfile: pkg/config/go.mod
          - module: logging
            filter: pkg-logging
            sumfile: pkg/logging/go.sum
    runs-on: ubuntu-latest
    steps:
      # Gated per-step rather than a job-level `if: needs.changes.outputs[matrix.filter]`:
      # the matrix context isn't available in jobs.<job_id>.if, so that form silently
      # skips every matrix combo. Don't revert to a job-level `if`.
      - name: Check whether this module changed
        id: gate
        run: echo "run=${{ needs.changes.outputs[matrix.filter] }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.sumfile }}
      - name: Run go vet
        if: steps.gate.outputs.run == 'true'
        working-directory: pkg/${{ matrix.module }}
        run: go vet ./...
      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        working-directory: pkg/${{ matrix.module }}
        run: go test -race -count=1 -timeout 5m -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage summary
        if: steps.gate.outputs.run == 'true' && always() && !cancelled()
        working-directory: pkg/${{ matrix.module }}
        run: |
          echo "## Coverage: pkg/${{ matrix.module }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
