name: Web App Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-checks.yml'

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npx tsc --noEmit

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npx eslint .

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        working-directory: .
        run: npm ci
      - run: npx vitest run
