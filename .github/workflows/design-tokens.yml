name: Design Tokens

on:
  pull_request:
    branches:
      - main
    paths:
      - 'design/tokens/**'
      - 'apps/web/src/theme/colors.css'
      - 'apps/mobile/src/constants/colors.ts'
      - 'package-lock.json'
      - '.github/workflows/design-tokens.yml'

jobs:
  generated:
    name: Generated color files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci -w @cairn/tokens
      - run: npm run build -w @cairn/tokens
      - name: Fail if generated files differ from design/tokens/colors.json
        run: git diff --exit-code -- apps/web/src/theme/colors.css apps/mobile/src/constants/colors.ts
