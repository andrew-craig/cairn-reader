name: Design Tokens

on:
  pull_request:
    branches:
      - main
      - feature/ios-native-migration
    paths:
      - 'design/tokens/**'
      - 'apps/web/src/theme/colors.css'
      - 'apps/mobile/src/constants/colors.ts'
      - 'apps/ios/CairnReader/Resources/Colors.xcassets/**'
      - 'package-lock.json'
      - '.github/workflows/design-tokens.yml'

jobs:
  generated:
    name: Generated color files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci -w @cairn/tokens
      - run: npm run build -w @cairn/tokens
      - name: Fail if generated files differ from design/tokens/colors.json
        # git status, not git diff, so a colorset added or removed by the build also fails.
        run: |
          changes=$(git status --porcelain -- apps/web/src/theme/colors.css apps/mobile/src/constants/colors.ts apps/ios/CairnReader/Resources/Colors.xcassets)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            exit 1
          fi
